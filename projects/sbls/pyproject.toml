[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbls-aaai2027"
version = "1.0.0"
description = "Sequential Bayesian Label-Space Selection over evolving text taxonomies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "torch>=2.4",
  "transformers>=4.51,<5",
  "sentence-transformers>=3.2",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "scikit-learn>=1.4",
  "pandas>=2.1",
]

[project.optional-dependencies]
nf4 = ["bitsandbytes>=0.45"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
plots = ["matplotlib>=3.8"]

[project.scripts]
sbls = "sbls.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
